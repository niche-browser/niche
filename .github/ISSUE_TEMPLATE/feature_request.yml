name: Feature request
description: Something Niche should do.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What you'd like
      description: What it should do, and what you'd use it for.
    validations:
      required: true
  - type: textarea
    id: arc
    attributes:
      label: How Arc did it
      description: How it looked and behaved in Arc. Screenshots or a recording from Arc are gold.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        An idea Arc never had goes in [Ideas](https://github.com/niche-browser/niche/discussions/categories/ideas) instead, where others can upvote it. Niche has no built-in AI, account or telemetry, so requests in those directions will be closed. The [roadmap](https://nichebrowser.app/roadmap) lists what's already planned.
