name: CI

# A push of docs alone runs nothing (and so doesn't cancel the run in progress). Pull requests
# always run: main requires the Tests and Build checks, and a skipped run never reports them.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only unless a job asks for more: the build job runs pull requests' code.
permissions:
  contents: read

jobs:
  test:
    name: Tests
    # No Chromium download: Packages/NicheCore and the harnesses compile only the files they test.
    runs-on: macos-26
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint
        run: scripts/lint.py

      # Every test once, compiled with coverage; a failing test fails this step with its output.
      # Gates: changed lines under test >= 70 %, NicheCore >= 85 % (docs/testing.md).
      - name: NicheCore, harnesses and coverage
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        run: |
          set -o pipefail
          scripts/coverage.py --base "${{ github.event.pull_request.base.sha || github.event.before }}" | tee coverage.md

      # A new branch's first push has no base to measure changed lines against.
      - name: NicheCore and harnesses
        if: github.event_name != 'pull_request' && github.event.before == '0000000000000000000000000000000000000000'
        run: scripts/test.sh

      # Fork pull requests get a read-only token: the job summary has the same table.
      - name: Coverage comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [ -s coverage.md ] || exit 0
          { echo "### Coverage"; echo; cat coverage.md; } > comment.md
          gh pr comment "$PR" --body-file comment.md --edit-last 2>/dev/null || gh pr comment "$PR" --body-file comment.md

  build:
    name: Build Niche.app
    # Same runner as release.yml, so CI builds what ships.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Read pinned CEF version
        id: cef
        run: echo "version=$(sed -n 's/^CEF_VERSION="${CEF_VERSION:-\(.*\)}"$/\1/p' scripts/fetch-cef.sh)" >> "$GITHUB_OUTPUT"

      # Both CEF builds and the universal framework joined from them (scripts/fetch-cef.sh).
      - name: Cache CEF
        uses: actions/cache@v6
        with:
          path: |
            vendor/cef
            vendor/cef-other
            vendor/cef-universal
          key: cef-universal-${{ runner.arch }}-${{ steps.cef.outputs.version }}-${{ hashFiles('scripts/fetch-cef.sh') }}

      # Universal, as releases are: one app for Apple silicon and Intel.
      - name: Build (debug, universal, ad-hoc signed)
        env:
          NICHE_UNIVERSAL: "1"
        run: scripts/build.sh debug

      - name: Verify bundle
        run: |
          codesign --verify --deep --strict --verbose=2 build/Niche.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Niche.app/Contents/Info.plist

      # Launches the app three times and quits it; fails on a crash, hang or crash report.
      # Not blocking until it has proved steady on the hosted runners.
      - name: Smoke test
        continue-on-error: true
        timeout-minutes: 5
        run: Tests/smoke-launch.sh build/Niche.app

      # One short journey on every pull request (thirty tabs put to sleep); the full set and the
      # component snapshots run nightly (nightly.yml). Not blocking until steady on these runners.
      - name: Scenario
        continue-on-error: true
        timeout-minutes: 5
        run: scripts/scenario.sh sleep-tabs

      # Blocking: the latest release makes a profile and this build opens it. A cookie, a page's
      # site data, the open tab and Chromium's protected settings (the extension list) must all
      # survive; 0.1.11 signed everyone out and lost every extension (22 Nov 2026).
      - name: Update from the latest release
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/update-from-release.sh

      # Blocking: the universal app's Intel slice, under Rosetta on this runner (the free Intel
      # runner is a VM whose GPU Metal can't place, and SwiftUI's renderer aborts there; this one
      # has a GPU). Every Niche the run starts must say "on x86_64" in niche.log. Budgets only
      # report: Rosetta's timing is not an Intel Mac's.
      - name: Scenario (Intel slice)
        timeout-minutes: 15
        env:
          NICHE_ARCH: x86_64
          NICHE_BUDGETS: report
          # Rosetta translates Chromium at its first launch here: minutes on this runner; and
          # translated code is slow, so waits last longer.
          NICHE_START_TIMEOUT: "300"
          NICHE_PATIENCE: "4"
        # Shields: the Rust engine, Chromium's request path, page scripts and hiding, on x86_64.
        run: scripts/scenario.sh shields

      # NicheCore's decisions compiled for x86_64 and run under Rosetta (the free Intel runner's
      # newest Xcode is older than this one and doesn't compile the tests). SwiftPM's own test
      # runner is arm64 only; Xcode's xctest has both slices and runs Swift Testing's tests.
      - name: NicheCore tests (Intel slice)
        working-directory: Packages/NicheCore
        run: |
          swift build --build-tests --arch x86_64 --scratch-path .build/intel --build-system swiftbuild
          # Where the bundle lands and what it is called depend on SwiftPM's build system
          # (NicheCoreTests.xctest, or NicheCorePackageTests.xctest): the one built for x86_64.
          BUNDLE=""
          while IFS= read -r b; do
            name="$(basename "$b" .xctest)"
            [ "$(lipo -archs "$b/Contents/MacOS/$name" 2>/dev/null)" = x86_64 ] && BUNDLE="$b"
          done < <(find .build/intel -name '*.xctest' -type d)
          [ -n "$BUNDLE" ] || { echo "No x86_64 test bundle" >&2; exit 1; }
          echo "$BUNDLE"
          arch -x86_64 "$(xcrun -f xctest)" "$BUNDLE" 2>&1 | tee "$RUNNER_TEMP/intel-tests.log"
          # A bundle xctest finds no Swift Testing tests in passes with none run: that proves nothing.
          ran="$(sed -n 's/.*Test run with \([0-9][0-9]*\) tests.*passed.*/\1/p' "$RUNNER_TEMP/intel-tests.log" | tail -1)"
          [ "${ran:-0}" -gt 0 ] || { echo "No NicheCore test ran as x86_64" >&2; exit 1; }
          echo "$ran NicheCore tests passed as x86_64"

      - name: Update from the latest release (Intel slice)
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
          NICHE_ARCH: x86_64
          NICHE_START_TIMEOUT: "300"
          NICHE_PATIENCE: "4"
        run: scripts/update-from-release.sh

      - name: Keep scenario logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scenario-logs
          path: build/scenarios
          if-no-files-found: ignore
